apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: crash-recommendation
  namespace: boutique
spec:
  schedule: "@every 60s"
  concurrencyPolicy: Forbid
  historyLimit: 2
  type: PodChaos
  podChaos:
    action: pod-failure
    mode: one
    duration: "20s"
    selector:
      namespaces:
        - boutique
      labelSelectors:
        app: recommendationservice
