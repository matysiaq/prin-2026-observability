---
# Fetches the kubeconfig from the master to the local machine and
# patches the server address to use the external IP so it works from
# Cloud Shell (or any machine outside the cluster VPC).
- hosts: masters
  become: yes
  tasks:
    - name: Fetch kubeconfig to local kubeconfigs/
      fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/../kubeconfigs/{{ cluster_name }}.config"
        flat: yes

    - name: Patch server address to use external IP
      delegate_to: localhost
      become: no
      replace:
        path: "{{ playbook_dir }}/../kubeconfigs/{{ cluster_name }}.config"
        regexp: 'server: https://[^:]+:6443'
        replace: "server: https://{{ master_ip }}:6443"
